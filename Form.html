<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Form Example</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>User Registration Form</h1>

    <form action="submit-form.php" method="POST" enctype="multipart/form-data">
        
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label><br>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="can't to say">can't to say
            </label><br><br>
        </fieldset>

        <fieldset>
            <legend>Interests</legend>
            <input type="checkbox" id="reading" name="interests" value="Reading">
            <label for="reading">Reading</label><br>

            <input type="checkbox" id="traveling" name="interests" value="Traveling">
            <label for="traveling">Traveling</label><br>

            <input type="checkbox" id="coding" name="interests" value="Coding">
            <label for="coding">Coding</label><br>

            <input type="checkbox" id="music" name="interests" value="Music">
            <label for="music">Music</label><br><br>
        </fieldset>

        <fieldset>
            <legend>Other Info</legend>

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">--Select Country--</option>
                <option value="Tanzania">Tanzania</option>
                <option value="Zambia">Zambia</option>
                <option value="Mombassa">Mombassa</option>
                <option value="Rwanda">Rwanda</option>
                <option value="Malawi">Malawi</option>
            </select><br><br>

            <label for="profilePic">Upload Profile Picture:</label>
            <input type="file" id="profilePic" name="profilePic" accept="image/*"><br><br>

        </fieldset>

        <input type="submit" value="Register">

    </form>
</body>

</html>
